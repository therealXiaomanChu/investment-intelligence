name: Test
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: intelligence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_runner -d intelligence_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[cloud,test]'
      - run: env -u GITHUB_ACTIONS python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test_runner:disposable_test_password@localhost:5432/intelligence_test
      - run: python -m investment_intelligence demo
